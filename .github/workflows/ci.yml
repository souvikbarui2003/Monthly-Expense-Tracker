name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun tsc -b --noEmit

      - name: Production build
        run: bun run build

  ml:
    name: ML Pipeline Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Syntax check Python files
        run: python -m py_compile data/generate_dataset.py && python -m py_compile training/train_classifier.py && python -m py_compile training/train_forecaster.py && python -m py_compile training/train_budget_model.py && python -m py_compile training/train_anomaly_model.py && python -m py_compile data/validate_dataset.py

      - name: Validate ML code structure
        run: python -c "import ast; [ast.parse(open(f).read()) for f in ['data/generate_dataset.py', 'training/train_classifier.py', 'training/train_forecaster.py', 'training/train_budget_model.py', 'training/train_anomaly_model.py', 'data/validate_dataset.py']]"
